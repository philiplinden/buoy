[package]
name = "buoy-gfx"
version = "0.1.0"
description = "Graphics for the Buoy simulator"
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }

[dependencies]
bevy = { workspace = true, features = [
    "bevy_asset",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_text",
    "bevy_window",
    "bevy_winit",
    "bevy_gizmos",
    "bevy_picking",
    "bevy_mesh_picking_backend",
    "default_font",
    "tonemapping_luts",
    "x11",
] }
avian3d = { workspace = true, optional = true, features = ["bevy_picking"] }
bevy-inspector-egui = { version = "0.33.1", optional = true, features = [
    "highlight_changes",
] }

[features]
default = ["dev"]
dev = [
    "bevy/dynamic_linking",
    "avian3d/diagnostic_ui",
    "avian3d/debug-plugin",
    "bevy/bevy_dev_tools",
    "bevy-inspector-egui",
]
